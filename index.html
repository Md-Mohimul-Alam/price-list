<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUXE Perfume | Product Price List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      letter-spacing: 5px;
      margin-bottom: 5px;
    }

    header p {
      color: #777;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background: #171717;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .summary {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      color: #555;
      font-size: 14px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th, td {
      padding: 13px 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #171717;
      color: white;
      font-size: 13px;
    }

    tr:hover td {
      background: #fafafa;
    }

    .price {
      font-weight: bold;
      color: #147a45;
    }

    #status {
      margin: 12px 0;
      color: #777;
      font-size: 13px;
    }

    .error {
      color: #c0392b !important;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #888;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
      }

      .toolbar, #status {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>LUXE</h1>
      <p>Luxury captured in every drop.</p>
      <h2>Product Price List</h2>
    </header>

    <div class="toolbar">
      <input
        type="text"
        id="search"
        placeholder="Search product name or size..."
      />

      <button onclick="loadProducts()">Refresh</button>
      <button onclick="window.print()">Print</button>
    </div>

    <div class="summary">
      <span>Products: <strong id="productCount">0</strong></span>
      <span>Variants: <strong id="variantCount">0</strong></span>
    </div>

    <div id="status">Loading products...</div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Product Name</th>
            <th>Size</th>
            <th>Price (BDT)</th>
          </tr>
        </thead>

        <tbody id="productTable">
          <tr>
            <td colspan="4" class="empty">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

<script>
  // Your LUXE backend API
  const API_URL =
    "https://perfume-stock-management-system-ewa.vercel.app/api";

  // Optional: add your authentication token here.
  // Leave empty if GET /products is publicly accessible.
  const AUTH_TOKEN = "";

  let allRows = [];

  async function loadProducts() {
    const status = document.getElementById("status");
    const table = document.getElementById("productTable");

    status.textContent = "Fetching products...";
    status.classList.remove("error");

    try {
      const response = await fetch(`${API_URL}/products`, {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          ...(AUTH_TOKEN
            ? { Authorization: `Bearer ${AUTH_TOKEN}` }
            : {})
        }
      });

      if (!response.ok) {
        throw new Error(`API error: ${response.status}`);
      }

      const result = await response.json();

      // Supports common API response formats
      const products = Array.isArray(result)
        ? result
        : result.products ||
          result.data?.products ||
          result.data ||
          [];

      if (!Array.isArray(products)) {
        throw new Error("Unexpected API response format.");
      }

      allRows = [];

      products.forEach(product => {
        const sizes = Array.isArray(product.sizes)
          ? product.sizes
          : product.sizes && typeof product.sizes === "object"
            ? Object.entries(product.sizes).map(([size, value]) => ({
                size,
                ...(typeof value === "object" ? value : { price: value })
              }))
            : [];

        // Products with size-based pricing
        if (sizes.length) {
          sizes.forEach(item => {
            allRows.push({
              name: product.name || "Unnamed Product",
              size: item.size || item.sizeMl || item.label || "-",
              price:
                item.price ??
                item.sellingPrice ??
                item.salePrice ??
                product.price ??
                product.sellingPrice ??
                "-"
            });
          });
        } else {
          // Products without size variants
          allRows.push({
            name: product.name || "Unnamed Product",
            size: product.size || product.sizeMl || "-",
            price:
              product.price ??
              product.sellingPrice ??
              product.salePrice ??
              "-"
          });
        }
      });

      renderTable(allRows);

      status.textContent = `Successfully loaded ${products.length} products.`;

    } catch (error) {
      console.error(error);

      status.textContent =
        "Failed to load products: " + error.message;

      status.classList.add("error");

      table.innerHTML = `
        <tr>
          <td colspan="4" class="empty">
            Could not load products. Check the API URL,
            authentication, and browser console.
          </td>
        </tr>
      `;
    }
  }

  function renderTable(rows) {
    const table = document.getElementById("productTable");

    document.getElementById("productCount").textContent =
      new Set(rows.map(row => row.name)).size;

    document.getElementById("variantCount").textContent =
      rows.length;

    if (!rows.length) {
      table.innerHTML = `
        <tr>
          <td colspan="4" class="empty">
            No products found.
          </td>
        </tr>
      `;
      return;
    }

    table.innerHTML = rows.map((item, index) => `
      <tr>
        <td>${index + 1}</td>
        <td>${escapeHTML(item.name)}</td>
        <td>${escapeHTML(item.size)}</td>
        <td class="price">
          ${item.price === "-"
            ? "-"
            : "৳" + escapeHTML(String(item.price))}
        </td>
      </tr>
    `).join("");
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  document.getElementById("search").addEventListener("input", event => {
    const keyword = event.target.value.toLowerCase();

    const filtered = allRows.filter(item =>
      item.name.toLowerCase().includes(keyword) ||
      String(item.size).toLowerCase().includes(keyword)
    );

    renderTable(filtered);
  });

  loadProducts();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXE | Fragrance Collection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --black: #11110f;
  --dark: #1c1b18;
  --gold: #c8a96b;
  --gold-light: #e5d2a6;
  --cream: #f6f2e9;
  --white: #fffdf8;
  --muted: #89857d;
  --border: #e8e1d4;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--cream);
  color: var(--black);
  font-family: 'DM Sans', sans-serif;
}

/* HERO */

.hero {
  background:
    radial-gradient(ellipse at 80% 20%, #393329 0%, transparent 45%),
    linear-gradient(120deg, #11110f, #26231e);
  color: var(--white);
  padding: 55px 20px 65px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before,
.hero::after {
  content: "";
  position: absolute;
  border: 1px solid rgba(200,169,107,.2);
  border-radius: 50%;
  width: 350px;
  height: 350px;
  pointer-events: none;
}

.hero::before {
  left: -220px;
  top: -180px;
}

.hero::after {
  right: -220px;
  bottom: -220px;
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 65px;
  font-weight: 600;
  letter-spacing: 15px;
  color: var(--gold-light);
}

.hero-line {
  width: 65px;
  height: 1px;
  background: var(--gold);
  margin: 12px auto;
}

.tagline {
  font-size: 10px;
  letter-spacing: 4px;
  color: #c9c2b4;
  text-transform: uppercase;
}

.hero h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 35px;
  font-weight: 400;
  margin-top: 35px;
  color: var(--white);
}

.hero-subtitle {
  font-size: 12px;
  color: #aaa397;
  margin-top: 8px;
}

/* MAIN */

.container {
  max-width: 1150px;
  margin: -25px auto 0;
  position: relative;
  padding: 0 20px 50px;
}

/* SUMMARY */

.summary {
  background: var(--white);
  border: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-radius: 10px;
  box-shadow: 0 8px 30px rgba(0,0,0,.05);
  margin-bottom: 35px;
}

.stat {
  text-align: center;
  padding: 22px 10px;
  border-right: 1px solid var(--border);
}

.stat:last-child {
  border: none;
}

.stat strong {
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  color: #a38348;
}

.stat span {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}

/* FILTERS */

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 20px;
  gap: 15px;
}

.section-heading h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 600;
}

.section-heading p {
  font-size: 12px;
  color: var(--muted);
}

.filters {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 17px;
  margin-bottom: 25px;
}

.search-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.search {
  flex: 1;
  min-width: 200px;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  outline: none;
  font-family: inherit;
}

.search:focus {
  border-color: var(--gold);
}

select, .action {
  padding: 12px 15px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: white;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.action {
  background: var(--black);
  color: var(--gold-light);
  border-color: var(--black);
}

.action:hover {
  background: #393329;
}

/* PRODUCT GRID */

.product-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.product-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 20px;
  transition: .2s ease;
}

.product-card:hover {
  border-color: var(--gold);
  box-shadow: 0 8px 22px rgba(0,0,0,.05);
  transform: translateY(-2px);
}

.product-title {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 10px;
  margin-bottom: 17px;
}

.product-title h4 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 600;
}

.product-number {
  color: #b6a98f;
  font-size: 10px;
  letter-spacing: 1px;
}

.type-label {
  display: inline-block;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #8d6e3d;
  background: #f2ead9;
  padding: 5px 8px;
  border-radius: 3px;
  margin-top: 5px;
}

.price-list {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.price-item {
  background: #f7f4ed;
  border-radius: 5px;
  padding: 10px 5px;
  text-align: center;
}

.price-item span {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 5px;
}

.price-item strong {
  font-size: 12px;
  color: #8e6e3c;
}

.no-results {
  grid-column: 1/-1;
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  background: var(--white);
  border-radius: 10px;
}

/* FOOTER */

footer {
  background: var(--black);
  color: var(--gold-light);
  text-align: center;
  padding: 35px 15px;
}

footer h2 {
  font-family: 'Cormorant Garamond', serif;
  letter-spacing: 8px;
  font-size: 30px;
}

footer p {
  font-size: 10px;
  letter-spacing: 3px;
  color: #a8a092;
  margin-top: 8px;
}

@media(max-width: 700px) {
  .hero {
    padding: 42px 15px 55px;
  }

  .logo {
    font-size: 52px;
    letter-spacing: 11px;
  }

  .hero h2 {
    font-size: 29px;
  }

  .container {
    padding: 0 12px 35px;
  }

  .product-grid {
    grid-template-columns: 1fr;
  }

  .summary .stat {
    padding: 17px 5px;
  }

  .stat strong {
    font-size: 25px;
  }

  .stat span {
    font-size: 8px;
    letter-spacing: 1px;
  }

  .search-row > * {
    width: 100%;
  }

  .section-heading h3 {
    font-size: 27px;
  }
}

@media print {
  body {
    background: white;
  }

  .hero {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .filters {
    display: none;
  }

  .container {
    margin: 20px auto;
  }

  .product-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .product-card {
    break-inside: avoid;
  }

  footer {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
</style>
</head>

<body>

<header class="hero">
  <div class="logo">LUXE</div>
  <div class="hero-line"></div>
  <p class="tagline">Luxury captured in every drop</p>
  <h2>The Fragrance Collection</h2>
  <p class="hero-subtitle">Discover your signature impression.</p>
</header>

<main class="container">

  <section class="summary">
    <div class="stat">
      <strong id="productCount">0</strong>
      <span>Fragrances</span>
    </div>
    <div class="stat">
      <strong id="variantCount">0</strong>
      <span>Price Options</span>
    </div>
    <div class="stat">
      <strong>3.5–100</strong>
      <span>Sizes (ml)</span>
    </div>
  </section>

  <section>
    <div class="section-heading">
      <div>
        <h3>Explore Our Collection</h3>
        <p>Find the perfect fragrance for every occasion.</p>
      </div>
    </div>

    <div class="filters">
      <div class="search-row">
        <input
          class="search"
          id="search"
          type="search"
          placeholder="Search your favourite fragrance..."
        >

        <select id="typeFilter">
          <option value="all">All Types</option>
          <option value="rollon">Roll-on</option>
          <option value="spray">Spray</option>
        </select>

        <select id="sizeFilter">
          <option value="all">All Sizes</option>
          <option value="3.5">3.5 ml</option>
          <option value="6">6 ml</option>
          <option value="15">15 ml</option>
          <option value="30">30 ml</option>
          <option value="50">50 ml</option>
          <option value="100">100 ml</option>
        </select>

        <button class="action" onclick="window.print()">
          Print Price List
        </button>
      </div>
    </div>

    <div id="productGrid" class="product-grid"></div>
  </section>

</main>

<footer>
  <h2>LUXE</h2>
  <p>WEAR THE IMPRESSION</p>
</footer>

<script>
/*
  Add your supplied product data here.

  Each product can have multiple sizes and prices.
  Example:
  {
    name: "Dunhil desire",
    type: "rollon",
    prices: {
      "3.5": 150,
      "6": 250,
      "15": 650,
      "30": 1250
    }
  }
*/

const products = [
  {
    name: "Dunhil desire",
    type: "rollon",
    prices: {"3.5":150,"6":250,"15":650,"30":1250}
  },
  {
    name: "Dunhil desire Spray",
    type: "spray",
    prices: {"6":300,"15":700,"30":1000,"50":1300,"100":1700}
  },
  {
    name: "Versace EROS",
    type: "rollon",
    prices: {"3.5":150,"6":250,"15":650,"30":1250}
  },
  {
    name: "Versace EROS Spray",
    type: "spray",
    prices: {"6":300,"15":700,"30":1000,"50":1300,"100":1700}
  },
  {
    name: "Blue berry",
    type: "rollon",
    prices: {"3.5":150,"6":250,"15":650,"30":1250}
  },
  {
    name: "Blue berry Spray",
    type: "spray",
    prices: {"6":300,"15":700,"30":1000,"50":1300,"100":1700}
  },
  {
    name: "Vampire B.",
    type: "rollon",
    prices: {"3.5":200,"6":300,"15":800,"30":1650}
  },
  {
    name: "Vampire B. Spray",
    type: "spray",
    prices: {"6":350,"15":850,"30":1500,"50":1900,"100":2200}
  }
];

const grid = document.getElementById("productGrid");

function money(value) {
  return "৳" + Number(value).toLocaleString("en-BD");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  })[c]);
}

function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const size = document.getElementById("sizeFilter").value;

  const filtered = products.filter(product => {
    const matchesName = product.name.toLowerCase().includes(search);
    const matchesType = type === "all" || product.type === type;
    const matchesSize = size === "all" || product.prices[size] !== undefined;

    return matchesName && matchesType && matchesSize;
  });

  document.getElementById("productCount").textContent = filtered.length;

  document.getElementById("variantCount").textContent =
    filtered.reduce((sum, p) => {
      if (size !== "all") return sum + 1;
      return sum + Object.keys(p.prices).length;
    }, 0);

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results">No fragrances found.</div>';
    return;
  }

  grid.innerHTML = filtered.map((product, index) => {
    const prices = Object.entries(product.prices)
      .filter(([ml]) => size === "all" || ml === size);

    return `
      <article class="product-card">
        <div class="product-title">
          <div>
            <h4>${escapeHTML(product.name)}</h4>
            <span class="type-label">
              ${product.type === "spray" ? "Perfume Spray" : "Perfume Oil / Roll-on"}
            </span>
          </div>
          <span class="product-number">
            ${String(index + 1).padStart(2,"0")}
          </span>
        </div>

        <div class="price-list">
          ${prices.map(([ml, price]) => `
            <div class="price-item">
              <span>${ml} ml</span>
              <strong>${money(price)}</strong>
            </div>
          `).join("")}
        </div>
      </article>
    `;
  }).join("");
}

["search","typeFilter","sizeFilter"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE | Product Price List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      letter-spacing: 7px;
      margin-bottom: 5px;
    }

    header p {
      color: #777;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      background: #171717;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .summary {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 15px;
      color: #555;
      font-size: 14px;
    }

    #status {
      margin: 12px 0;
      font-size: 13px;
      color: #777;
    }

    .error {
      color: #c0392b !important;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th, td {
      padding: 13px 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #171717;
      color: white;
      font-size: 13px;
    }

    tr:hover td {
      background: #fafafa;
    }

    .price {
      font-weight: bold;
      color: #147a45;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #888;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 12px;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
      }

      .toolbar, #status {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>LUXE</h1>
      <p>Luxury captured in every drop.</p>
      <h2>Product Price List</h2>
    </header>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search product or size..."
      >

      <button id="refreshBtn" onclick="loadProducts()">
        Refresh
      </button>

      <button onclick="window.print()">
        Print
      </button>
    </div>

    <div class="summary">
      <span>Products: <strong id="productCount">0</strong></span>
      <span>Variants: <strong id="variantCount">0</strong></span>
    </div>

    <div id="status">Connecting to LUXE server...</div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Product Name</th>
            <th>Size</th>
            <th>Price (BDT)</th>
          </tr>
        </thead>

        <tbody id="productTable">
          <tr>
            <td colspan="4" class="empty">Loading products...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer>
      LUXE Perfume · Wear the impression.
    </footer>

  </main>

  <script>
    // Your deployed backend URLs
    const API_SERVERS = [
      "https://perfume-stock-management-system-545.vercel.app",
      "https://perfume-stock-management-system-ewa.vercel.app"
    ];

    // Product API endpoint
    const PRODUCT_ENDPOINT = "/api/products";

    // Add a token here if your product GET endpoint requires authentication.
    const AUTH_TOKEN = "";

    let allRows = [];

    async function fetchFromServer(baseURL) {
      const headers = {
        "Accept": "application/json"
      };

      if (AUTH_TOKEN) {
        headers.Authorization = `Bearer ${AUTH_TOKEN}`;
      }

      const response = await fetch(
        `${baseURL}${PRODUCT_ENDPOINT}`,
        {
          method: "GET",
          headers,
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          `${baseURL}: HTTP ${response.status}`
        );
      }

      return await response.json();
    }

    function extractProducts(result) {
      if (Array.isArray(result)) return result;

      const candidates = [
        result?.products,
        result?.data?.products,
        result?.data,
        result?.results
      ];

      return candidates.find(Array.isArray) || null;
    }

    function getVariants(product) {
      const sizes = product.sizes;

      if (Array.isArray(sizes)) {
        return sizes;
      }

      if (sizes && typeof sizes === "object") {
        return Object.entries(sizes).map(([size, value]) => ({
          size,
          ...(typeof value === "object" && value !== null
            ? value
            : { price: value })
        }));
      }

      return [];
    }

    function formatPrice(value) {
      if (value === undefined || value === null || value === "") {
        return "-";
      }

      const number = Number(value);

      return Number.isFinite(number)
        ? "৳" + number.toLocaleString("en-BD")
        : String(value);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function normalizeProducts(products) {
      const rows = [];

      products.forEach(product => {
        const name = product.name || product.productName || "Unnamed Product";
        const variants = getVariants(product);

        if (variants.length > 0) {
          variants.forEach(variant => {
            rows.push({
              name,
              size:
                variant.size ??
                variant.sizeMl ??
                variant.label ??
                "-",
              price:
                variant.price ??
                variant.sellingPrice ??
                variant.salePrice ??
                variant.selling_price ??
                product.price ??
                product.sellingPrice ??
                "-"
            });
          });
        } else {
          rows.push({
            name,
            size: product.size ?? product.sizeMl ?? "-",
            price:
              product.price ??
              product.sellingPrice ??
              product.salePrice ??
              product.selling_price ??
              "-"
          });
        }
      });

      return rows;
    }

    async function loadProducts() {
      const status = document.getElementById("status");
      const table = document.getElementById("productTable");
      const button = document.getElementById("refreshBtn");

      button.disabled = true;
      status.className = "";
      status.textContent = "Connecting to backend...";

      let lastError = null;
      let products = null;
      let connectedServer = null;

      for (const server of API_SERVERS) {
        try {
          status.textContent = `Connecting to ${server}...`;

          const result = await fetchFromServer(server);
          const extracted = extractProducts(result);

          if (!extracted) {
            throw new Error(
              "API responded, but the product list format was unexpected."
            );
          }

          products = extracted;
          connectedServer = server;
          break;

        } catch (error) {
          console.error("Backend failed:", server, error);
          lastError = error;
        }
      }

      button.disabled = false;

      if (!products) {
        status.className = "error";
        status.textContent =
          "Unable to load products. " +
          (lastError?.message || "Check your API and CORS configuration.");

        table.innerHTML = `
          <tr>
            <td colspan="4" class="empty">
              Product data unavailable.
              Please try refreshing.
            </td>
          </tr>
        `;

        return;
      }

      allRows = normalizeProducts(products);

      renderTable(allRows);

      status.textContent =
        `Connected successfully · ${products.length} products loaded`;
    }

    function renderTable(rows) {
      const table = document.getElementById("productTable");

      document.getElementById("productCount").textContent =
        new Set(rows.map(row => row.name)).size;

      document.getElementById("variantCount").textContent =
        rows.length;

      if (!rows.length) {
        table.innerHTML = `
          <tr>
            <td colspan="4" class="empty">
              No products available.
            </td>
          </tr>
        `;
        return;
      }

      table.innerHTML = rows.map((item, index) => `
        <tr>
          <td>${index + 1}</td>
          <td>${escapeHTML(item.name)}</td>
          <td>${escapeHTML(item.size)}</td>
          <td class="price">${escapeHTML(formatPrice(item.price))}</td>
        </tr>
      `).join("");
    }

    document.getElementById("search").addEventListener("input", event => {
      const keyword = event.target.value.toLowerCase().trim();

      const filtered = allRows.filter(item =>
        item.name.toLowerCase().includes(keyword) ||
        String(item.size).toLowerCase().includes(keyword)
      );

      renderTable(filtered);
    });

    loadProducts();
  </script>
</body>
</html>

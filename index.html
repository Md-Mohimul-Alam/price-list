<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUXE | Product Price List</title>

  <meta name="theme-color" content="#111111">
  <meta name="description" content="LUXE Perfume product catalogue and price list.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 25px 15px;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand {
      font-size: 38px;
      letter-spacing: 9px;
      font-weight: 700;
    }

    .tagline {
      margin-top: 7px;
      color: #888;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .heading {
      margin-top: 25px;
      font-size: 21px;
      letter-spacing: 1px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 7px;
      outline: none;
      font-size: 14px;
    }

    .search-box:focus {
      border-color: #222;
    }

    button {
      padding: 12px 20px;
      background: #171717;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .summary {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      margin-bottom: 15px;
      font-size: 14px;
      color: #666;
    }

    .summary strong {
      color: #111;
    }

    .status {
      margin: 12px 0;
      font-size: 13px;
      color: #777;
      min-height: 18px;
    }

    .status.error {
      color: #c0392b;
    }

    .status.success {
      color: #16834b;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 7px;
    }

    table {
      width: 100%;
      min-width: 550px;
      border-collapse: collapse;
    }

    thead {
      background: #171717;
      color: white;
    }

    th {
      padding: 15px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
    }

    td {
      padding: 14px 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    .price {
      font-weight: 700;
      color: #16834b;
      white-space: nowrap;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: #888;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: #999;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 8px;
      }

      .container {
        padding: 18px 12px;
      }

      .brand {
        font-size: 31px;
      }

      .toolbar button {
        flex: 1;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        padding: 10px;
      }

      .toolbar,
      .status {
        display: none !important;
      }

      table {
        min-width: 100%;
      }

      th {
        background: #222 !important;
        color: white !important;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <div class="brand">LUXE</div>

      <p class="tagline">
        LUXURY CAPTURED IN EVERY DROP
      </p>

      <h2 class="heading">
        PRODUCT PRICE LIST
      </h2>
    </header>

    <section class="toolbar">

      <input
        type="search"
        id="searchInput"
        class="search-box"
        placeholder="Search perfume name or size..."
      >

      <button id="refreshButton">
        Refresh
      </button>

      <button id="printButton">
        Print
      </button>

    </section>

    <section class="summary">

      <div>
        Total Products:
        <strong id="productCount">0</strong>
      </div>

      <div>
        Total Variants:
        <strong id="variantCount">0</strong>
      </div>

    </section>

    <div id="status" class="status">
      Connecting to LUXE server...
    </div>

    <section class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>#</th>
            <th>Product Name</th>
            <th>Size</th>
            <th>Price (BDT)</th>
          </tr>
        </thead>

        <tbody id="productTable">

          <tr>
            <td colspan="4" class="empty">
              Loading products...
            </td>
          </tr>

        </tbody>

      </table>

    </section>

    <footer>
      LUXE PERFUME · WEAR THE IMPRESSION
    </footer>

  </main>

<script>

  // ==========================================
  // API CONFIGURATION
  // ==========================================

  const API_BASE_URL =
    "https://perfume-stock-management-system-ewa.vercel.app";

  const PRODUCT_ENDPOINT = "/api/products";

  // If your API requires authentication,
  // add a valid token here.
  const AUTH_TOKEN = "";

  let allRows = [];

  // ==========================================
  // DOM ELEMENTS
  // ==========================================

  const productTable =
    document.getElementById("productTable");

  const statusElement =
    document.getElementById("status");

  const refreshButton =
    document.getElementById("refreshButton");

  // ==========================================
  // FETCH PRODUCTS
  // ==========================================

  async function fetchProducts() {

    const headers = {
      "Accept": "application/json"
    };

    if (AUTH_TOKEN) {
      headers.Authorization =
        `Bearer ${AUTH_TOKEN}`;
    }

    const response = await fetch(
      `${API_BASE_URL}${PRODUCT_ENDPOINT}`,
      {
        method: "GET",
        headers,
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}: ${response.statusText}`
      );
    }

    return await response.json();
  }

  // ==========================================
  // EXTRACT PRODUCT ARRAY
  // ==========================================

  function extractProducts(result) {

    if (Array.isArray(result)) {
      return result;
    }

    const possibleArrays = [
      result?.products,
      result?.data?.products,
      result?.data,
      result?.results
    ];

    return possibleArrays.find(
      Array.isArray
    ) || null;
  }

  // ==========================================
  // EXTRACT SIZE VARIANTS
  // ==========================================

  function getVariants(product) {

    const sizes = product.sizes;

    if (Array.isArray(sizes)) {
      return sizes;
    }

    if (
      sizes &&
      typeof sizes === "object"
    ) {
      return Object.entries(sizes).map(
        ([size, value]) => ({
          size,
          ...(typeof value === "object" && value !== null
            ? value
            : { price: value })
        })
      );
    }

    return [];
  }

  // ==========================================
  // NORMALIZE PRODUCT DATA
  // ==========================================

  function normalizeProducts(products) {

    const rows = [];

    products.forEach(product => {

      const name =
        product.name ||
        product.productName ||
        product.title ||
        "Unnamed Product";

      const variants = getVariants(product);

      if (variants.length > 0) {

        variants.forEach(variant => {

          rows.push({

            name,

            size:
              variant.size ??
              variant.sizeMl ??
              variant.label ??
              "-",

            price:
              variant.price ??
              variant.sellingPrice ??
              variant.salePrice ??
              variant.selling_price ??
              product.price ??
              product.sellingPrice ??
              "-"

          });

        });

      } else {

        rows.push({

          name,

          size:
            product.size ??
            product.sizeMl ??
            "-",

          price:
            product.price ??
            product.sellingPrice ??
            product.salePrice ??
            product.selling_price ??
            "-"

        });

      }

    });

    return rows;
  }

  // ==========================================
  // SAFE HTML OUTPUT
  // ==========================================

  function escapeHTML(value) {

    return String(value).replace(
      /[&<>"']/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]
    );

  }

  // ==========================================
  // PRICE FORMAT
  // ==========================================

  function formatPrice(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "-";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
      return String(value);
    }

    return "৳" +
      number.toLocaleString("en-BD");
  }

  // ==========================================
  // RENDER TABLE
  // ==========================================

  function renderTable(rows) {

    document.getElementById(
      "productCount"
    ).textContent = new Set(
      rows.map(item => item.name)
    ).size;

    document.getElementById(
      "variantCount"
    ).textContent = rows.length;

    if (!rows.length) {

      productTable.innerHTML = `
        <tr>
          <td colspan="4" class="empty">
            No products found.
          </td>
        </tr>
      `;

      return;
    }

    productTable.innerHTML =
      rows.map((item, index) => `

        <tr>

          <td>${index + 1}</td>

          <td>
            ${escapeHTML(item.name)}
          </td>

          <td>
            ${escapeHTML(item.size)}
          </td>

          <td class="price">
            ${escapeHTML(formatPrice(item.price))}
          </td>

        </tr>

      `).join("");

  }

  // ==========================================
  // LOAD ALL PRODUCTS
  // ==========================================

  async function loadProducts() {

    refreshButton.disabled = true;

    statusElement.className = "status";

    statusElement.textContent =
      "Connecting to LUXE backend...";

    try {

      const result = await fetchProducts();

      const products =
        extractProducts(result);

      if (!products) {

        console.error(
          "Unexpected API response:",
          result
        );

        throw new Error(
          "Unexpected API response. Expected a product array."
        );

      }

      allRows = normalizeProducts(products);

      renderTable(allRows);

      statusElement.className =
        "status success";

      statusElement.textContent =
        `Successfully loaded ${products.length} products.`;

      console.log(
        "LUXE products:",
        products
      );

    } catch (error) {

      console.error(
        "LUXE API Error:",
        error
      );

      statusElement.className =
        "status error";

      statusElement.textContent =
        `Unable to load products: ${error.message}`;

      productTable.innerHTML = `
        <tr>
          <td colspan="4" class="empty">
            Unable to load product data.
            Please check the backend API.
          </td>
        </tr>
      `;

    } finally {

      refreshButton.disabled = false;

    }

  }

  // ==========================================
  // SEARCH
  // ==========================================

  document.getElementById(
    "searchInput"
  ).addEventListener("input", event => {

    const keyword =
      event.target.value
        .toLowerCase()
        .trim();

    const filtered = allRows.filter(item =>

      item.name.toLowerCase().includes(keyword) ||

      String(item.size)
        .toLowerCase()
        .includes(keyword)

    );

    renderTable(filtered);

  });

  // ==========================================
  // BUTTON EVENTS
  // ==========================================

  refreshButton.addEventListener(
    "click",
    loadProducts
  );

  document.getElementById(
    "printButton"
  ).addEventListener(
    "click",
    () => window.print()
  );

  // ==========================================
  // INITIAL LOAD
  // ==========================================

  loadProducts();

</script>

</body>
</html>
